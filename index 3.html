<title>Мефикс</title>

<style>
:root{--bg:#0d0f14;--c:#171a22;--c2:#222633;--t:#eef0f5;--m:#8b92a3;--a:#ff6a2b;--g:#2ecc71;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--t);font:16px system-ui,-apple-system,sans-serif}
body{padding:env(safe-area-inset-top) 0 0}
#app{padding:14px 14px 150px;max-width:640px;margin:auto}
h1{font-size:24px;margin:6px 0 12px}h2{font-size:18px;margin:16px 0 8px}
.card{background:var(--c);border-radius:16px;padding:14px;margin-bottom:12px}
.m{color:var(--m);font-size:14px}
.btn{width:100%;padding:14px;border:0;border-radius:14px;background:var(--a);color:#fff;font-size:17px;font-weight:700;margin-top:8px}
.btn.s{background:var(--c2);color:var(--t)}
.chip{display:inline-block;padding:9px 13px;margin:3px 3px 3px 0;border-radius:20px;border:0;background:var(--c2);color:var(--t);font-size:14px}
.chip.on{background:var(--a)}
.sb{width:46px;height:46px;border-radius:12px;border:0;background:var(--c2);color:var(--t);font-size:16px;font-weight:700;margin:4px 6px 0 0}
.sb.on{background:var(--g);color:#04210f}
input,select,textarea{width:100%;padding:12px;border-radius:12px;border:1px solid #333a4d;background:var(--c2);color:var(--t);font-size:16px;margin:4px 0}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#10131a;border-top:1px solid #222;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;background:none;border:0;color:var(--m);padding:9px 0;font-size:11px}
nav button span{display:block;font-size:20px}nav button.on{color:var(--a)}
#rt{display:none;position:fixed;left:12px;right:12px;bottom:calc(64px + env(safe-area-inset-bottom,0px));background:var(--c2);border-radius:14px;padding:10px 14px;z-index:6;flex-direction:column;gap:6px;font-weight:700}
#rt i{display:block;height:6px;background:var(--a);border-radius:3px}
.chat{height:46vh;overflow:auto;background:var(--c);border-radius:16px;padding:10px;margin-bottom:8px}
.msg{padding:9px 12px;border-radius:14px;margin:6px 0;max-width:88%;line-height:1.35}
.msg.ai{background:var(--c2)}.msg.user{background:var(--a);margin-left:auto}
.tama{width:120px;height:120px;border-radius:50%;margin:0 auto;display:block;object-fit:cover;object-position:center 30%;border:4px solid var(--a);cursor:pointer}
.bub{text-align:center;color:var(--m);min-height:22px;margin-top:6px}
.big{font-size:44px;font-weight:800;line-height:1}
#cv{width:100%;height:420px;touch-action:none;border-radius:16px;background:radial-gradient(#2a3048,#10131a);display:block}
#ed{position:fixed;inset:0;background:#000c;z-index:20;display:none;align-items:flex-end}
#ed>div{background:var(--c);width:100%;max-height:70vh;overflow:auto;border-radius:20px 20px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px))}
.done{opacity:.55}.now{background:#2a2113;border:1px solid var(--a)}
.ln{display:flex;justify-content:space-between;padding:8px 10px;border-radius:10px;margin:3px 0;background:var(--c2)}
.br{color:var(--m);font-size:13px;padding:0 10px}

// ===== РАСПИСАНИЕ =====
const BELL=[[480,520],[530,570],[580,620],[635,675],[690,730],[740,780],[790,830],[840,880]];
const SCH={1:['РОВ','Литература','Обществознание','Информатика','История','Геометрия','Физика','Алгебра'],2:['Русский язык','Английский язык','Алгебра','Обществознание','Геометрия','Физика','Физкультура'],3:[null,'Химия','Литература','Проект','История','Английский язык','География'],4:[null,'Химия','Обществознание','ОБЗР','Литература','Физика','Алгебра','Алгебра'],5:['Биология','Русский язык','Обществознание','Физкультура','Вероятность и статистика','Английский язык','Геометрия']};

const hm=m=>Math.floor(m/60)+':'+String(m%60).padStart(2,0);
function lessonNow(){const n=new Date(),d=n.getDay(),m=n.getHours()*60+n.getMinutes(),L=SCH[d];
 if(!L)return'Сегодня выходной 🎉';
 let cur=-1,nx=-1;L.forEach((x,i)=>{if(!x)return;if(m>=BELL[i][0]&&m<BELL[i][1])cur=i;else if(BELL[i][0]>m&&nx<0)nx=i});
 if(cur>=0){let s=`Сейчас <b>${L[cur]}</b> (${cur+1}-й урок): ${hm(BELL[cur][0])}–${hm(BELL[cur][1])}, до звонка ${BELL[cur][1]-m} мин.`;const j=L.findIndex((x,i)=>i>cur&&x);
  return s+(j>=0?`<br>Дальше: <b>${L[j]}</b> в ${hm(BELL[j][0])} (перемена ${BELL[j][0]-BELL[cur][1]} мин)`:'<br>Это последний урок.')}
 if(nx>=0)return`${m<BELL[0][0]?'Уроки ещё не начались':'Перемена'}: до звонка ${BELL[nx][0]-m} мин. Дальше <b>${L[nx]}</b> в ${hm(BELL[nx][0])}.`;
 return d===5&&m<1050?'Уроки закончились — допы по русскому (домой ~17:30–18:00).':'Уроки на сегодня закончились.'}
let SD=(new Date().getDay()%6)||1;
function dayView(d){const L=SCH[d],m=new Date().getHours()*60+new Date().getMinutes(),td=d===new Date().getDay();if(!L)return'<div class="m">Выходной</div>';let h='',p=-1;
 L.forEach((x,i)=>{if(!x)return;if(p>=0)h+=`<div class="br">перемена ${BELL[i][0]-BELL[p][1]} мин (${hm(BELL[p][1])}–${hm(BELL[i][0])})</div>`;p=i;
  h+=`<div class="ln ${td&&m>=BELL[i][0]&&m<BELL[i][1]?'now':''}"><span>${i+1}. ${x}</span><span class="m">${hm(BELL[i][0])}–${hm(BELL[i][1])}</span></div>`});
 if(d===5)h+='<div class="br">после уроков допы по русскому, домой ~17:30–18:00</div>';
 return h+`<div class="m" style="margin-top:6px">Уроки заканчиваются в ${hm(BELL[p][1])}</div>`}

const EASY={dec:'push',dia:'push',push:'knee',bpress:'knee',pull:'row',leg:'crunch',fly:'knee',row:'sup'};
const P={1:{name:'Грудь + пресс',k:['dec','push','dia','fly','plank','leg']},2:{name:'Грудь + спина',k:['push','bpress','pull','row','crunch']},3:{name:'Пресс + ноги',k:['squat','leg','crunch','plank','sup']},4:{name:'Грудь',k:['dec','dia','bpress','push','plank']},5:{name:'Короткая: грудь + пресс',k:['push','dia','crunch','plank']},6:{name:'Грудь + пресс',k:['dec','push','fly','leg','plank']},0:{name:'Лёгкий день',k:['plank','sup','crunch']}};
const plan=()=>P[new Date().getDay()];
// опрос
const SV=[['sleep','Сколько спал?',['<6 ч','6–7','7–8','8+']],['sore','Болят мышцы?',['нет','слегка','сильно']],['en','Энергия',['низкая','норм','высокая']],['time','Сколько есть времени?',['15 мин','30 мин','45 мин','60+']],['vb','Был сегодня волейбол?',['нет','да']]];
let SVT={};
const LV=['мягкая','средняя','жёсткая'];
function eff(){const v=S.sv[dk()];let b=S.lvl+(S.adj[dk()]||0);if(v&&v.sleep!==undefined){const p=[-2,-1,0,.5][v.sleep]+[.5,-.5,-1.5][v.sore]+[-1,0,.5][v.en]-(v.vb?.5:0);b+=p/2}return Math.max(0,Math.min(2,Math.round(b)))}
const NS=()=>[2,3,4][eff()];
function list(){const sub=S.sub[dk()]||{},seen={},out=[],v=S.sv[dk()]||{};
 plan().k.forEach(o=>{let k=sub[o]||o;if(EX[k].bar&&!S.bar)k='row';if(EX[k].band&&!S.band)k=EX[k].bar?'sup':'knee';if(seen[k])return;seen[k]=1;out.push({o,k})});
 const n=S.short?3:v.time!==undefined?[2,3,4,99][v.time]:99;return out.slice(0,n)}
let tm=0,tt;
function rest(s){clearInterval(tt);tm=s;upd();tt=setInterval(()=>{tm--;if(tm<=0){clearInterval(tt);beep()}upd()},1000)}
function upd(){$('#rt').style.display=tm>0?'flex':'none';$('#rt span').textContent='⏱ Отдых '+tm+' с';$('#rt i').style.width=(tm/60*100)+'%'}
function beep(){try{const a=new AudioContext(),o=a.createOscillator();o.connect(a.destination);o.frequency.value=880;o.start();o.stop(a.currentTime+.25)}catch(e){}}
function setTap(k,i){const s=S.sets[dk()]=S.sets[dk()]||{};const was=s[k]||0;s[k]=was===i+1?i:i+1;sv();if(s[k]>was)rest(60);go('train')}
function rep(o){const s=S.sub[dk()]=S.sub[dk()]||{},cur=s[o]||o;if(EASY[cur]){s[o]=EASY[cur];sv();go('train')}else alert('Проще уже некуда 🙂')}
function how(k){alert(EX[k].n+'\n\n'+EX[k].h)}
function opt(k,v){S[k]=v;sv();go(cur)}
function adj(d){S.adj[dk()]=(S.adj[dk()]||0)+d;sv();go('train')}
function finish(){const L=list(),s=S.sets[dk()]||{};let t=0,d=0;L.forEach(x=>{t+=NS();d+=Math.min(s[x.k]||0,NS())});const p=t?Math.round(d/t*100):0;
 if(!d){alert('Отметь хотя бы один подход');return}
 if(S.last!==dk()){S.streak=(S.last===yest()?S.streak:0)+1;S.last=dk()}
 S.done[dk()]=p;sv();beep();alert(p>=100?'Тренировка закрыта на 100% 🔥':'Засчитано '+p+'%. Недоделанное — нормально, главное регулярность.');go('home')}
function svDone(){if(Object.keys(SVT).length<SV.length){alert('Ответь на все вопросы');return}S.sv[dk()]=Object.assign({},SVT);SVT={};sv();go('train')}
function trainView(){const dd=dk();
 if(!S.sv[dd])return`<h1>Перед тренировкой</h1><div class="card">${SV.map(q=>`<b>${q[1]}</b><div style="margin:4px 0 12px">${q[2].map((o,i)=>`<button class="chip ${SVT[q[0]]===i?'on':''}" onclick="SVT['${q[0]}']=${i};go('train')">${o}</button>`).join('')}</div>`).join('')}<button class="btn" onclick="svDone()">Готово</button><button class="btn s" onclick="S.sv['${dd}']={};sv();go('train')">Пропустить опрос</button></div><p class="m">По ответам приложение подберёт нагрузку и число упражнений на сегодня. Это только на сегодня: уровень не падает навсегда.</p>`;
 const L=list(),s=S.sets[dd]||{},v=S.sv[dd],e=eff();
 return`<h1>Тренировка</h1><div class="card"><b>${plan().name}</b><div class="m">Нагрузка сегодня: <b style="color:var(--a)">${LV[e]}</b> · ${NS()} подхода · ${L.length} упр.${v.sore===2?'<br>Мышцы сильно болят — не тяни, лучше мягко.':''}${v.sleep===0?'<br>Спал мало — техника важнее повторов.':''}</div>
 <div style="margin-top:8px"><button class="chip" onclick="adj(-1)">Мягче</button><button class="chip" onclick="adj(1)">Жёстче</button><button class="chip ${S.short?'on':''}" onclick="opt('short',${S.short?0:1})">Мало сил/времени</button><button class="chip" onclick="delete S.sv['${dd}'];sv();go('train')">Опрос заново</button></div></div>`+
 L.map(x=>{const q=EX[x.k],n=s[x.k]||0;let b='';for(let i=0;i<NS();i++)b+=`<button class="sb ${n>i?'on':''}" onclick="setTap('${x.k}',${i})">${i+1}</button>`;
 return`<div class="card ${n>=NS()?'done':''}"><b>${q.n}</b><div class="m">${NS()} × ${q.r[e]}${x.k==='plank'?' сек':''}</div>${b}
 <div class="row" style="margin-top:8px"><button class="chip" onclick="how('${x.k}')">Как делать</button><button class="chip" onclick="rep('${x.o}')">Заменить на проще</button></div></div>`}).join('')+
 `<button class="btn" onclick="finish()">Завершить (можно с недоделанными подходами)</button>
 <p class="m">Прогрессия осторожная: базовый уровень меняй вручную в «Ещё», ориентируясь на замеры (макс. отжиманий).</p>`}

const PR=['Красавчик! Так держать 💪','Грудь растёт, пока ты не сдаёшься','Каждый подход — шаг к Питеру','Ты сильнее, чем вчера','Серия горит! 🔥'];

function fl(s){return s>=365?['#fff','Радужный',90,'👑']:s>=200?['#7df9ff','Ледяной',155,'']:s>=100?['#ff2d55','Алый',330,'']:s>=30?['#2f7bff','Синий',190,'']:s>=10?['#b84dff','Ярко-фиолетовый',255,'']:s>=3?['#ffd23f','Золотой',20,'']:['#ff6a2b','Оранжевый',0,'']}
function monthBox(){const ds=Object.keys(S.done).sort();if(!ds.length)return'<div class="m">Месяц начнётся после первого выполненного дня тренировки.</div>';
 const n=Math.round((t0()-new Date(ds[0]+'T00:00:00'))/864e5)+1,inM=ds.filter(d=>Math.round((new Date(d+'T00:00:00')-new Date(ds[0]+'T00:00:00'))/864e5)<30).length,pc=Math.round(inM/Math.min(n,30)*100);
 return`День <b>${Math.min(n,30)}</b> из 30 (старт ${ds[0]})<br>Тренировок: ${inM} · регулярность ${pc}%<br><span class="m">${n>30?'Месяц завершён. Оценка: '+(pc>=80?'отлично 🔥':pc>=60?'хорошо':'есть куда расти'):pc>=80?'Идёшь отлично':pc>=50?'Нормально, не пропускай':'Надо подтянуться'}</span>`}

const DN=[['воскресен',0],['понедельн',1],['вторник',2],['сред',3],['четверг',4],['пятниц',5],['суббот',6]];
function dayOf(l){const t=new Date().getDay();if(/послезавтра/.test(l))return(t+2)%7;if(/завтра/.test(l))return(t+1)%7;for(const[k,v]of DN)if(l.includes(k))return v;return/сегодня/.test(l)?t:null}
function sch(d,l){const L=SCH[d],N='На '+DAYS[d];if(!L)return N+' уроков нет.';
 const ix=L.map((x,i)=>x?i:-1).filter(i=>i>=0),f=ix[0],e=ix[ix.length-1];
 if(/перв/.test(l))return`${N}: первый урок — <b>${L[f]}</b> в ${hm(BELL[f][0])} (${f+1}-й).`;
 if(/послед/.test(l))return`${N}: последний урок — <b>${L[e]}</b>, до ${hm(BELL[e][1])}.`;
 if(/заканч|домой|до скольки/.test(l))return`${N} уроки заканчиваются в ${hm(BELL[e][1])}${d===5?', потом допы по русскому (домой ~17:30–18:00)':''}.`;
 return`${N}:<br>`+ix.map(i=>`${i+1}. ${L[i]} ${hm(BELL[i][0])}–${hm(BELL[i][1])}`).join('<br>')+(d===5?'<br>+ допы по русскому':'')}
function ans(t){const l=t.toLowerCase(),L=list(),d=dayOf(l);
 if(/болит|боль|замен/.test(l)){if(/бицепс|рук/.test(l))return'Если болит бицепс — без подтягиваний и тяги. Замени на <b>Супермен</b> или добавь пресс. Кнопка «Заменить на проще» есть на карточке.';
  if(/груд|плеч/.test(l))return'Болит грудь/плечо — замени отжимания на <b>тягу резинки</b> или ноги, верху дай отдохнуть. Если боль острая — стоп и к врачу.';
  return'Если что-то болит — не мучай это место: тренируй другую группу или отдохни. Острая боль — к врачу.'}
 if(/как делать|техник/.test(l)){const k=Object.keys(EX).find(k=>l.includes(EX[k].kw));return k?`<b>${EX[k].n}</b><br>${EX[k].h}<br>Цель: ${NS()} × ${EX[k].r[eff()]}`:'Спроси про конкретное упражнение: «как делать планку».'}
 if(/питер|23 март/.test(l))return`До Питера (23 марта) — <b>${dl(2027,3,23)}</b> дн.`;
 if(/23 феврал/.test(l))return`До 23 февраля — <b>${dl(2027,2,23)}</b> дн.`;
 if(/серия|огонёк|огонек/.test(l)){const s=streak(),f=fl(s);return`Серия: <b>${s}</b> дн., огонёк «${f[1]}». Цвета меняются на 3, 10, 30, 100, 200, 365 день.`}
 if(/сейчас|текущ|идёт|идет/.test(l)&&/урок|перемен|звонок/.test(l))return lessonNow();
 if(d!==null&&/урок|расписан|перв|послед|заканч|во сколько|что у меня|пары/.test(l))return sch(d,l);
 if(/звонок|звонки|перемен/.test(l))return'Звонки: 8:00–8:40, 8:50–9:30, 9:40–10:20, 10:35–11:15, 11:30–12:10, 12:20–13:00, 13:10–13:50, 14:00–14:40. Перемены: 10, 10, 15, 15, 10, 10, 10 мин.';
 if(/урок|расписан/.test(l))return lessonNow()+'<br>Спроси про любой день: «расписание на среду».';
 if(/план|сегодня|упражнен|тренир/.test(l))return`Сегодня: <b>${plan().name}</b>, нагрузка ${LV[eff()]}, ${NS()} подхода.<br>${L.map(x=>EX[x.k].n).join(', ')}`;
 if(/нагрузк|жестч|жёстч|мягч|тяжел|легк/.test(l))return`Нагрузка сегодня: <b>${LV[eff()]}</b> (по опросу и твоему выбору). Меняй кнопками «Мягче/Жёстче» на вкладке тренировки.`;
 if(/груд/.test(l))return'Для плотной груди: отжимания ноги на стуле + ромбовидные + белок и сон. Живот уходит от общего режима, не от одних упражнений.';
 if(/еда|кушать|пицц|белок|питан/.test(l))return'Белок каждый день (яйца, мясо, творог, гречка), поменьше сладкого и газировки. Не голодай — для мышц нужна еда.';
 if(/сон|спать|спал|нарин/.test(l))return'Мышцы растут во сне. Если по утрам тяжело вставать, подвинь разговор на 23:30–00:00. Опрос перед тренировкой учитывает, сколько ты спал.';
 if(/мотивац|устал|лень|грустн/.test(l))return'Вспомни Питер 23 марта. Устал — выбери «мягче» или сделай одно упражнение: серия важнее идеала. А если грустно и не хватает объятий — это нормально, напиши близким.';
 if(/брекет|зуб/.test(l))return'С брекетами: ORCA, ёршики между скобами, скребок для языка каждый вечер. Белый налёт/комочки в гландах — полоскание и вода.';
 if(/кож|прыщ/.test(l))return'Умывание утром и вечером, Mixit с ниацинамидом/цинком по тюбику, прыщи не выдавливай, наволочку меняй чаще.';
 if(/волос|кудр/.test(l))return'Кудри: мягкий шампунь, кондиционер, сушить диффузором или естественно, чуть крема/соли-спрея для текстуры, по бокам подравнивать каждые 3–4 недели.';
 return'Я умею: расписание на любой день («что в среду»), «какой урок сейчас», план и нагрузку на сегодня, технику, замены при боли, дни до Питера и 23 февраля, серию, еду, сон, брекеты, кожу, волосы.'}
